services:
  app:
    build: .
    image: veltrix-peopleops:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CORPUS_DIR: /data/corpus
      MANIFEST_PATH: /data/manifest.json
      DB_PATH: /data/veltrix.db
      VECTOR_DIR: /data/index
      STATE_DB: /data/state.db
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s
